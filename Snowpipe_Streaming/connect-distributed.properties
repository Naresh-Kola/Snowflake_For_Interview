# Kafka Connect Distributed Mode Configuration
# =============================================

# Kafka broker endpoints (internal Docker network)
bootstrap.servers=broker-1:19092,broker-2:19092

# Unique name for the Connect cluster
group.id=snowflake-connect-cluster

# Converters: how Connect serializes keys and values
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false

# Internal converter for Connect's own data (offsets, configs, status)
internal.key.converter=org.apache.kafka.connect.json.JsonConverter
internal.value.converter=org.apache.kafka.connect.json.JsonConverter
internal.key.converter.schemas.enable=false
internal.value.converter.schemas.enable=false

# Topics where Connect stores its own state
config.storage.topic=connect-configs
config.storage.replication.factor=2

offset.storage.topic=connect-offsets
offset.storage.replication.factor=2
offset.storage.partitions=3

status.storage.topic=connect-status
status.storage.replication.factor=2
status.storage.partitions=3

# REST API listener
rest.advertised.host.name=kafka-connect
rest.port=8083

# Plugin path inside the container
plugin.path=/opt/kafka/connect-plugins
